# Deployment nach Cloudflare (ADR-0012).
#
# Pull Request: nur ein Trockenlauf. Er prueft Build und wrangler.jsonc, braucht
#   keine Zugangsdaten und laeuft deshalb auch fuer Pull Requests aus Forks.
# main: Pruefung, Freigabe im Environment "production", Deployment, danach ein
#   Abruf der echten Adresse. Ein Produktivdeployment gibt es nur von main.
#
# Einrichtung (Secrets, Environment, Cloudflare): docs/betrieb/einrichtung-cloudflare.html
name: Deployment

on:
  push:
    branches: [main]
  pull_request:
  # Erneutes Deployment ohne neuen Commit, etwa nach dem Go-Live (VORABZUGANG=aus).
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  # Produktprinzip 4: keine Nutzungsdaten an Dritte.
  WRANGLER_SEND_METRICS: "false"
  # Bewusst per npx mit fester Version statt als devDependency (wie Lighthouse):
  # wrangler bringt die Laufzeit workerd mit, die sonst jeder Pruefjob installiert.
  WRANGLER_VERSION: "4.151.3"
  ADRESSE: https://altstipendiaten-jahrestagung.de

jobs:
  trockenlauf:
    name: Konfiguration prüfen
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Wrangler-Trockenlauf
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --dry-run

  produktion:
    name: Produktion
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Die Freigabe im Environment haelt den Job an, bevor er ueberhaupt startet.
    environment:
      name: production
      url: https://altstipendiaten-jahrestagung.de
    # Ein laufendes Deployment wird nie abgebrochen; das naechste wartet.
    concurrency:
      group: deployment-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # main ist nur ueber einen geprueften PR erreichbar. Die schnelle Stufe laeuft
      # trotzdem noch einmal auf genau dem Commit, der live geht.
      - name: Prüfen
        run: npm run pruefen

      # Erneut bauen, diesmal mit dem optionalen Zugangswort (ADR-0010). Nicht schon
      # in "Prüfen": Die Tests sollen ohne Sperre laufen.
      - name: Bauen
        run: npm run build
        env:
          ZUGANGSWORT: ${{ secrets.ZUGANGSWORT }}

      - name: Nach Cloudflare deployen
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --message "${GITHUB_SHA::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # Prueft die echte Adresse von aussen. Solange VORABZUGANG nicht ausdruecklich
      # "aus" ist, MUSS Cloudflare Access davorstehen - eine ohne Anmeldung
      # erreichbare Seite ist dann ein Fehler, kein Erfolg.
      - name: Auslieferung prüfen
        env:
          VORABZUGANG: ${{ vars.VORABZUGANG || 'aktiv' }}
        run: |
          set -euo pipefail

          # Eine neue Version ist nach wenigen Sekunden weltweit aktiv.
          abrufen() {
            for versuch in 1 2 3 4 5 6; do
              if curl -sS -o /dev/null -D kopf.txt -w '%{http_code}' "$1" > status.txt; then
                cat status.txt
                return
              fi
              sleep 10
            done
            echo "::error::$1 ist nicht erreichbar." >&2
            exit 1
          }

          kopfzeile() { grep -i "^$1:" kopf.txt | head -1 | cut -d' ' -f2- | tr -d '\r' || true; }

          status=$(abrufen "$ADRESSE/")

          if [ "$VORABZUGANG" != "aus" ]; then
            ziel=$(kopfzeile location)
            if [ "$status" != "302" ] || [[ "$ziel" != *cloudflareaccess.com* ]]; then
              echo "::error::Vorabzugang ist aktiv, aber $ADRESSE/ antwortet ohne Anmeldung mit $status (Location: ${ziel:-keine}). Cloudflare Access pruefen!"
              exit 1
            fi
            echo "Geschuetzt: Ohne Anmeldung leitet die Seite zu Cloudflare Access weiter."
            exit 0
          fi

          if [ "$status" != "200" ]; then
            echo "::error::$ADRESSE/ antwortet mit $status statt 200."
            exit 1
          fi

          abrufen "$ADRESSE/sw.js" > /dev/null
          if [[ "$(kopfzeile cache-control)" != *no-cache* ]]; then
            echo "::error::/sw.js wird zwischengespeichert - public/_headers wirkt nicht."
            exit 1
          fi

          status=$(abrufen "https://www.altstipendiaten-jahrestagung.de/")
          if [ "$status" != "301" ] || [[ "$(kopfzeile location)" != "$ADRESSE/"* ]]; then
            echo "::error::www leitet nicht dauerhaft auf $ADRESSE weiter (Status $status)."
            exit 1
          fi

          echo "Oeffentlich erreichbar, Kopfzeilen und www-Weiterleitung stimmen."
